name: CodeQL

# Análise estática de segurança (SAST) do C# e do TypeScript. Resultados em Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira, pega vulnerabilidades novas em código já existente

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: backend/global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build do backend
        if: matrix.language == 'csharp'
        run: dotnet build backend/Pedidos.sln -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
