name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  backend:
    name: Backend (.NET 10) — build, unit e integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Pedidos.sln
      - name: Build (warnings = erros)
        run: dotnet build Pedidos.sln --no-restore -c Release
      - name: Testes unitários
        run: dotnet test --project tests/Pedidos.UnitTests -c Release --no-build
      - name: Testes de integração (Testcontainers + SQL Server real)
        run: dotnet test --project tests/Pedidos.IntegrationTests -c Release --no-build
      - name: Pacotes com vulnerabilidade conhecida
        run: |
          dotnet list Pedidos.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -qiE "\b(High|Critical)\b" vuln.txt; then echo "::error::Pacote vulnerável (High/Critical)"; exit 1; fi

  frontend:
    name: Frontend — lint, typecheck, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  mcp:
    name: MCP SQL Server — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-sqlserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mcp-sqlserver/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E — docker compose up + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (um único comando, sem ajustes manuais — CA-15)
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Smoke de carga (k6, 20s)
        run: |
          sed -e "s/duration: '45s'/duration: '10s'/" -e "s/duration: '60s'/duration: '20s'/" tests/load/pedidos.k6.js > /tmp/smoke.k6.js
          docker run --rm -i --network pedidos_default -e BASE_URL=http://api:8080 grafana/k6 run --quiet - < /tmp/smoke.k6.js
      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
